<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>化学構造式かるた</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 全画面共通の畳背景 -->
    <div class="tatami-bg"></div>

    <!-- ローディング -->
    <div id="loading-screen" class="screen active">
        <div class="loading-content">
            <div class="loading-logo">化学</div>
            <h1 class="loading-title">構造式かるた</h1>
            <div class="loading-bar"><div class="loading-progress"></div></div>
        </div>
    </div>

    <!-- タイトル画面 -->
    <div id="screen-title" class="screen">
        <div class="title-bg"></div>
        <div class="title-container">
            <div class="title-logo">
                <h1 class="title-main">化学構造式かるた</h1>
                <p class="title-sub">ONLINE</p>
            </div>
            <nav class="title-menu">
                <button class="menu-btn" data-next="screen-difficulty">
                    <span class="menu-text">対戦</span>
                </button>
                <button class="menu-btn" data-next="screen-stats">
                    <span class="menu-text">記録</span>
                </button>
                <button class="menu-btn" data-next="screen-reference">
                    <span class="menu-text">資料</span>
                </button>
                <button class="menu-btn" data-next="screen-settings">
                    <span class="menu-text">設定</span>
                </button>
            </nav>
        </div>
    </div>

    <!-- 難易度・単元選択 -->
    <div id="screen-difficulty" class="screen">
        <button class="back-btn" data-back="screen-title">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
            </svg>
        </button>
        <div class="difficulty-container">
            <h2 class="section-title">対戦設定</h2>
            
            <div class="setting-section">
                <h3 class="setting-section-title">難易度</h3>
                <div class="difficulty-list">
                    <button class="diff-btn" data-level="7">
                        <svg class="diff-icon" viewBox="0 0 64 64" width="48" height="48">
                            <circle cx="32" cy="16" r="5" fill="currentColor"/>
                            <circle cx="16" cy="40" r="5" fill="currentColor"/>
                            <circle cx="48" cy="40" r="5" fill="currentColor"/>
                            <ellipse cx="32" cy="32" rx="20" ry="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <ellipse cx="32" cy="32" rx="20" ry="10" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(60 32 32)"/>
                            <ellipse cx="32" cy="32" rx="20" ry="10" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(-60 32 32)"/>
                        </svg>
                        <span class="diff-text">難しい</span>
                    </button>
                    <button class="diff-btn selected" data-level="3">
                        <svg class="diff-icon" viewBox="0 0 64 64" width="48" height="48">
                            <circle cx="20" cy="20" r="6" fill="currentColor"/>
                            <circle cx="44" cy="20" r="6" fill="currentColor"/>
                            <circle cx="32" cy="44" r="6" fill="currentColor"/>
                            <line x1="20" y1="20" x2="44" y2="20" stroke="currentColor" stroke-width="2.5"/>
                            <line x1="20" y1="20" x2="32" y2="44" stroke="currentColor" stroke-width="2.5"/>
                            <line x1="44" y1="20" x2="32" y2="44" stroke="currentColor" stroke-width="2.5"/>
                        </svg>
                        <span class="diff-text">普通</span>
                    </button>
                    <button class="diff-btn" data-level="1">
                        <svg class="diff-icon" viewBox="0 0 64 64" width="48" height="48">
                            <circle cx="24" cy="24" r="6" fill="currentColor"/>
                            <circle cx="40" cy="40" r="6" fill="currentColor"/>
                            <line x1="24" y1="24" x2="40" y2="40" stroke="currentColor" stroke-width="2.5"/>
                        </svg>
                        <span class="diff-text">易しい</span>
                    </button>
                    <button class="diff-btn" data-level="0">
                        <svg class="diff-icon" viewBox="0 0 64 64" width="48" height="48">
                            <circle cx="32" cy="20" r="8" fill="currentColor"/>
                            <path d="M16 52 Q16 36 32 36 Q48 36 48 52" fill="currentColor"/>
                        </svg>
                        <span class="diff-text">練習</span>
                    </button>
                </div>
            </div>

            <div class="setting-section">
                <h3 class="setting-section-title">単元（複数選択可）</h3>
                <div class="category-grid" id="category-grid"></div>
                <button class="select-all-btn" id="btn-select-all">すべて解除</button>
            </div>

            <button class="next-btn" id="btn-start-difficulty">開始</button>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="screen-game" class="screen">
        <div class="game-bg"></div>
        <header class="game-header">
            <div class="score-display">
                <div class="score-box player-score" id="player-score-box">
                    <div class="score-label" id="player-score-label">PLAYER</div>
                    <div class="score-value" id="score-player">0</div>
                </div>
            </div>
            <div class="round-display">
                <div class="round-label">出札</div>
                <div class="round-value" id="round-display">1 / 10</div>
            </div>
            <div class="score-display">
                <div class="score-box cpu-score" id="cpu-score-box">
                    <div class="score-label" id="cpu-score-label">CPU</div>
                    <div class="score-value" id="score-cpu">0</div>
                </div>
            </div>
        </header>
        
        <div class="clue-display">
            <div class="clue-history" id="clue-history"></div>
            <div class="clue-card">
                <div class="clue-stage" id="clue-stage">STAGE 1</div>
                <div class="clue-text" id="clue-text">読み札がここに表示されます</div>
            </div>
            <div class="clue-controls">
                <button class="clue-btn" id="btn-hint" title="ヒント">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6C7.8 12.16 7 10.63 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z" fill="currentColor"/>
                    </svg>
                </button>
                <button class="clue-btn" id="btn-next-clue" title="次の情報">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>

        <main class="card-field" id="card-grid"></main>

        <footer class="game-footer">
            <button class="footer-btn" id="btn-skip">スキップ</button>
            <button class="footer-btn" id="btn-pause">一時停止</button>
        </footer>
    </div>

    <!-- 資料画面 -->
    <div id="screen-reference" class="screen">
        <button class="back-btn" data-back="screen-title">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
            </svg>
        </button>
        <div class="reference-container">
            <h2 class="section-title">資料</h2>
            <p class="section-subtitle">収録化合物の一覧（タップで詳細表示）</p>
            
            <div class="reference-category-tabs" id="reference-tabs"></div>
            <div class="reference-list" id="reference-list"></div>
        </div>
    </div>

    <!-- 資料詳細モーダル -->
    <div id="reference-detail-modal" class="modal-overlay">
        <div class="modal-content reference-modal">
            <button class="modal-close-btn" id="modal-close-btn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
                </svg>
            </button>
            <div class="reference-detail-header">
                <div class="reference-detail-name" id="detail-name"></div>
                <div class="reference-detail-formula" id="detail-formula"></div>
            </div>
            <div class="reference-detail-structure" id="detail-structure"></div>
            <div class="reference-detail-stages" id="detail-stages"></div>
            <div class="reference-detail-explanation" id="detail-explanation"></div>
        </div>
    </div>

    <!-- 設定画面 -->
    <div id="screen-settings" class="screen">
        <button class="back-btn" data-back="screen-title">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
            </svg>
        </button>
        <div class="settings-container">
            <h2 class="section-title">設定</h2>
            <div class="setting-section">
                <h3 class="setting-section-title">音量</h3>
                <div class="setting-item">
                    <label class="setting-label">読手</label>
                    <div class="volume-slider">
                        <div class="volume-bar" style="width: 30%;"></div>
                    </div>
                    <span class="volume-value">3</span>
                </div>
                <div class="setting-item">
                    <label class="setting-label">SE</label>
                    <div class="volume-slider">
                        <div class="volume-bar" style="width: 30%;"></div>
                    </div>
                    <span class="volume-value">3</span>
                </div>
                <div class="setting-item">
                    <label class="setting-label">BGM</label>
                    <div class="volume-slider">
                        <div class="volume-bar" style="width: 30%;"></div>
                    </div>
                    <span class="volume-value">3</span>
                </div>
            </div>
            <div class="setting-section">
                <h3 class="setting-section-title">その他</h3>
                <div class="setting-item">
                    <label class="setting-label">音声読み上げ</label>
                    <label class="toggle">
                        <input type="checkbox" id="setting-voice" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <label class="setting-label">音声速度</label>
                    <select id="setting-voice-speed" class="setting-select">
                        <option value="0.75">0.75倍</option>
                        <option value="1.0" selected>1.0倍</option>
                        <option value="1.25">1.25倍</option>
                        <option value="1.5">1.5倍</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label class="setting-label">カード表示数</label>
                    <select id="setting-card-count" class="setting-select">
                        <option value="6">6枚</option>
                        <option value="9" selected>9枚</option>
                        <option value="12">12枚</option>
                        <option value="16">16枚</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-danger" id="btn-reset-stats">統計データを初期化</button>
        </div>
    </div>

    <!-- 統計画面（拡張版） -->
    <div id="screen-stats" class="screen">
        <button class="back-btn" data-back="screen-title">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
            </svg>
        </button>
        <div class="stats-container">
            <h2 class="section-title">記録</h2>
            
            <!-- プロフィールカード -->
            <div class="profile-card">
                <div class="profile-name">Player</div>
                <div class="profile-rank" id="profile-rank">段位: 初心者</div>
                <div class="profile-points" id="profile-total-score">0 pt</div>
            </div>

            <!-- 基本統計 -->
            <div class="stats-section">
                <h3 class="stats-section-title">基本統計</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">プレイ回数</div>
                        <div class="stat-value" id="stat-games">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">正答率</div>
                        <div class="stat-value" id="stat-accuracy">0%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">最高コンボ</div>
                        <div class="stat-value" id="stat-max-combo">0</div>
                    </div>
                </div>
            </div>

            <!-- CPU戦績 -->
            <div class="stats-section">
                <h3 class="stats-section-title">CPU戦績</h3>
                <div class="cpu-record-grid">
                    <div class="cpu-record-item win">
                        <div class="cpu-record-label">勝利</div>
                        <div class="cpu-record-value" id="stat-cpu-wins">0</div>
                    </div>
                    <div class="cpu-record-item lose">
                        <div class="cpu-record-label">敗北</div>
                        <div class="cpu-record-value" id="stat-cpu-losses">0</div>
                    </div>
                    <div class="cpu-record-item draw">
                        <div class="cpu-record-label">引分</div>
                        <div class="cpu-record-value" id="stat-cpu-draws">0</div>
                    </div>
                    <div class="cpu-record-item rate">
                        <div class="cpu-record-label">勝率</div>
                        <div class="cpu-record-value" id="stat-cpu-winrate">0%</div>
                    </div>
                </div>
            </div>

            <!-- 単元別正答率 -->
            <div class="stats-section">
                <h3 class="stats-section-title">単元別正答率</h3>
                <div class="category-bars" id="category-bars"></div>
            </div>

            <!-- 難易度別正答率 -->
            <div class="stats-section">
                <h3 class="stats-section-title">難易度別正答率</h3>
                <div class="difficulty-bars" id="difficulty-bars"></div>
            </div>

            <!-- ステージ別正答率 -->
            <div class="stats-section">
                <h3 class="stats-section-title">ステージ別正答率</h3>
                <div class="stage-bars" id="stage-bars"></div>
            </div>

            <!-- 最近のプレイ履歴 -->
            <div class="stats-section">
                <h3 class="stats-section-title">最近のプレイ</h3>
                <div class="history-list" id="history-list"></div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
    <script src="audio.js"></script>
    <script src="storage.js"></script>
    <script src="cpu.js"></script>
    <script src="game.js"></script>
    <script src="app.js"></script>
</body>
</html>
