<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>化学構造式かるた</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ローディング -->
    <div id="loading-screen" class="screen active">
        <div class="loading-content">
            <div class="loading-logo">化学</div>
            <h1 class="loading-title">構造式かるた</h1>
            <div class="loading-bar"><div class="loading-progress"></div></div>
        </div>
    </div>

    <!-- タイトル画面 -->
    <div id="screen-title" class="screen">
        <div class="title-bg"></div>
        <div class="title-container">
            <div class="title-logo">
                <h1 class="title-main">化学構造式かるた</h1>
                <p class="title-sub">ONLINE</p>
            </div>
            <nav class="title-menu">
                <button class="menu-btn" data-next="screen-difficulty">
                    <span class="menu-text">対戦</span>
                </button>
                <button class="menu-btn" data-next="screen-stats">
                    <span class="menu-text">記録</span>
                </button>
                <button class="menu-btn">
                    <span class="menu-text">資料</span>
                </button>
                <button class="menu-btn" data-next="screen-settings">
                    <span class="menu-text">設定</span>
                </button>
            </nav>
        </div>
    </div>

    <!-- 難易度選択 -->
    <div id="screen-difficulty" class="screen">
        <button class="back-btn" data-back="screen-title">×</button>
        <div class="difficulty-container">
            <h2 class="section-title">難易度</h2>
            <p class="section-subtitle">対戦する難易度を選択してください</p>
            <div class="difficulty-grid">
                <button class="diff-card" data-level="7">
                    <div class="diff-icon">⚛</div>
                    <h3>難しい</h3>
                    <div class="diff-line"></div>
                    <p>読みの途中でも<br>札が確定した時に<br>素早く取ってきます</p>
                </button>
                <button class="diff-card selected" data-level="3">
                    <div class="diff-icon">⚗</div>
                    <h3>普通</h3>
                    <div class="diff-line"></div>
                    <p>読みの途中でも<br>札が確定した時に<br>取ってきます</p>
                </button>
                <button class="diff-card" data-level="1">
                    <div class="diff-icon">⚗</div>
                    <h3>易しい</h3>
                    <div class="diff-line"></div>
                    <p>読みを最後まで<br>聞いてから<br>取ってきます</p>
                </button>
                <button class="diff-card" data-level="0">
                    <div class="diff-icon">👤</div>
                    <h3>練習</h3>
                    <div class="diff-line"></div>
                    <p>1人で練習できます</p>
                </button>
            </div>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="screen-game" class="screen">
        <div class="game-bg"></div>
        <header class="game-header">
            <div class="player-info">
                <div class="player-name">出札 自陣</div>
            </div>
            <div class="game-timer">
                <div class="timer-label">TIME</div>
                <div class="timer-value" id="timer">+0.000秒</div>
            </div>
        </header>
        
        <div class="clue-display">
            <div class="clue-card">
                <div class="clue-stage" id="clue-stage">STAGE 1</div>
                <div class="clue-text" id="clue-text">読み札がここに表示されます</div>
            </div>
        </div>

        <main class="card-field" id="card-grid"></main>

        <footer class="game-footer">
            <button class="footer-btn" id="btn-skip">スキップ</button>
            <button class="footer-btn" id="btn-pause">一時停止</button>
        </footer>
    </div>

    <!-- 設定画面 -->
    <div id="screen-settings" class="screen">
        <button class="back-btn" data-back="screen-title">×</button>
        <div class="settings-container">
            <h2 class="section-title">設定</h2>
            <div class="setting-item">
                <label class="setting-label">音声読み上げ</label>
                <label class="toggle">
                    <input type="checkbox" id="setting-voice" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <label class="setting-label">音声速度</label>
                <select id="setting-voice-speed" class="setting-select">
                    <option value="0.75">0.75倍</option>
                    <option value="1.0" selected>1.0倍</option>
                    <option value="1.25">1.25倍</option>
                    <option value="1.5">1.5倍</option>
                </select>
            </div>
            <div class="setting-item">
                <label class="setting-label">カード表示数</label>
                <select id="setting-card-count" class="setting-select">
                    <option value="6">6枚</option>
                    <option value="9" selected>9枚</option>
                    <option value="12">12枚</option>
                    <option value="16">16枚</option>
                </select>
            </div>
            <button class="btn btn-danger" id="btn-reset-stats">統計データを初期化</button>
        </div>
    </div>

    <!-- 統計画面 -->
    <div id="screen-stats" class="screen">
        <button class="back-btn" data-back="screen-title">×</button>
        <div class="stats-container">
            <h2 class="section-title">記録</h2>
            <div class="profile-card">
                <div class="profile-name">Player</div>
                <div class="profile-rank">段位: 初心者</div>
                <div class="profile-points">3000 pt</div>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">勝率</div>
                    <div class="stat-value" id="stat-winrate">0%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">取得率</div>
                    <div class="stat-value" id="stat-accuracy">0%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">プレイ回数</div>
                    <div class="stat-value" id="stat-games">0</div>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
    <script src="audio.js"></script>
    <script src="storage.js"></script>
    <script src="cpu.js"></script>
    <script src="game.js"></script>
    <script src="app.js"></script>
</body>
</html>
